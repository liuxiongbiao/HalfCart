# =============================================
# HalfCart Redis 7 配置
# =============================================
port 6379
bind 0.0.0.0
requirepass halfcart_redis_2024

# 内存管理
maxmemory 256mb
maxmemory-policy allkeys-lru

# 持久化 (RDB + AOF 混合)
save 900 1
save 300 10
save 60 10000
appendonly yes
appendfsync everysec

# 连接
timeout 300
tcp-keepalive 60

# 日志
loglevel notice
logfile /data/redis.log
