<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
<title>半仓智拼 · 页面不存在</title>
<style>
:root { --primary:#FF7D00; --bg:#F5F7FA; --hint:#86909C; }
*{margin:0;padding:0;box-sizing:border-box}
body{ font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;
  background:var(--bg);display:flex;justify-content:center;align-items:center;min-height:100vh }
.center{ text-align:center;padding:40px }
.icon{ font-size:64px;margin-bottom:16px }
h2{ font-size:20px;color:#1D2129;margin-bottom:8px }
p{ font-size:14px;color:var(--hint);margin-bottom:24px }
.btn{ display:inline-block;padding:12px 40px;border-radius:24px;background:var(--primary);
  color:#fff;font-size:15px;font-weight:600;text-decoration:none }
</style>
</head>
<body>
<div class="center">
  <div class="icon">🔗</div>
  <h2>页面不存在</h2>
  <p>你访问的页面可能已被移除或链接错误</p>
  <a class="btn" href="index.html">返回首页</a>
</div>
</body>
</html>
