<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no,viewport-fit=cover">
<title>半仓智拼 · 聊天</title>
<script src="https://unpkg.com/vue@3.4/dist/vue.global.prod.js"></script>
<script src="https://unpkg.com/vant@4/lib/vant.min.js"></script>
<link rel="stylesheet" href="https://unpkg.com/vant@4/lib/index.css" /> 
<link rel="stylesheet" href="css/design-system.css" />
<script src="js/common.js"></script>
<style>
/* ═══════════════════════════════════════════
   HalfCart H5 全局设计规范 V1.0
   主色:#FF7D00 | 背景:#F5F7FA
   ═══════════════════════════════════════════ */
:root {
  --primary:#FF7D00; --primary-light:rgba(255,125,0,.08);
  --bg:#F5F7FA; --title:#1D2129; --body:#4E5969; --hint:#86909C;
  --shadow:0 2px 8px rgba(0,0,0,.05);
  --radius-bubble:16px; --radius-input:24px;
  --safe-bottom:env(safe-area-inset-bottom,0px);
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  background:var(--bg);color:var(--body);-webkit-font-smoothing:antialiased;
  display:flex;justify-content:center;min-height:100vh
}
#app{
  width:100%;max-width:480px;height:100vh;background:var(--bg);
  position:relative;overflow:hidden;display:flex;flex-direction:column
}
/* ── 顶部导航 ── */
.nav-bar{
  flex-shrink:0;display:flex;align-items:center;height:56px;padding:0 16px;gap:10px;
  background:rgba(255,255,255,.88);backdrop-filter:blur(16px);
  -webkit-backdrop-filter:blur(16px);border-bottom:1px solid rgba(0,0,0,.04);z-index:10
}
.nav-back{font-size:22px;color:var(--title);flex-shrink:0;cursor:pointer}
.nav-avatar{
  width:36px;height:36px;border-radius:50%;flex-shrink:0;
  background:linear-gradient(135deg,#4FACFE,#00F2FE);display:flex;align-items:center;
  justify-content:center;font-size:15px;color:#fff;font-weight:600
}
.nav-info{flex:1;min-width:0}
.nav-name{font-size:15px;font-weight:600;color:var(--title)}
.nav-status{font-size:11px;color:var(--hint)}
.nav-more{font-size:20px;color:var(--title);flex-shrink:0;cursor:pointer}

/* ── 消息列表 ── */
.msg-list{
  flex:1;overflow-y:auto;padding:12px 12px 8px;
  -webkit-overflow-scrolling:touch;scroll-behavior:smooth
}
.msg-list::-webkit-scrollbar{display:none}
.msg-date-divider{text-align:center;margin:16px 0 8px;font-size:11px;color:var(--hint)}

/* 系统通知 */
.sys-msg{text-align:center;margin:8px 0}
.sys-msg span{
  display:inline-block;padding:4px 14px;border-radius:12px;background:rgba(0,0,0,.04);
  font-size:12px;color:var(--hint);max-width:85%
}

/* 对方消息 */
.msg-left{display:flex;gap:8px;margin-bottom:16px;align-items:flex-start}
.msg-left .avatar{
  width:34px;height:34px;border-radius:50%;flex-shrink:0;
  background:linear-gradient(135deg,#4FACFE,#00F2FE);display:flex;align-items:center;
  justify-content:center;font-size:14px;color:#fff;font-weight:600
}
.msg-left .bubble-wrap{max-width:75%}
.msg-left .bubble{
  padding:10px 14px;border-radius:var(--radius-bubble);border-top-left-radius:4px;
  background:rgba(255,255,255,.9);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  box-shadow:var(--shadow);border:1px solid rgba(255,255,255,.8);
  font-size:15px;color:var(--title);line-height:1.55;word-break:break-word
}
.msg-left .time{font-size:10px;color:var(--hint);margin-top:4px;margin-left:4px}

/* 自己消息 */
.msg-right{display:flex;justify-content:flex-end;margin-bottom:16px;align-items:flex-start}
.msg-right .bubble-wrap{max-width:75%;display:flex;flex-direction:column;align-items:flex-end}
.msg-right .bubble{
  padding:10px 14px;border-radius:var(--radius-bubble);border-top-right-radius:4px;
  background:var(--primary);font-size:15px;color:#fff;line-height:1.55;word-break:break-word
}
.msg-right .time{font-size:10px;color:var(--hint);margin-top:4px;margin-right:4px}

/* 消息入场 */
.msg-item{animation:msgIn .3s ease both}
@keyframes msgIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:translateY(0)}}

/* ── 底部输入栏 ── */
.input-bar{
  flex-shrink:0;display:flex;align-items:flex-end;gap:8px;
  padding:8px 12px calc(8px + var(--safe-bottom));
  background:rgba(255,255,255,.92);backdrop-filter:blur(16px);
  -webkit-backdrop-filter:blur(16px);border-top:1px solid rgba(0,0,0,.04);z-index:10
}
.emoji-btn{font-size:24px;flex-shrink:0;cursor:pointer;padding:4px;color:var(--hint)}
.msg-input{
  flex:1;min-height:36px;max-height:100px;padding:8px 14px;border-radius:var(--radius-input);
  border:1px solid rgba(0,0,0,.06);background:#F2F3F5;font-size:15px;color:var(--title);
  outline:none;resize:none;font-family:inherit;line-height:1.4;transition:all .25s ease
}
.msg-input:focus{border-color:var(--primary);background:#fff;box-shadow:0 0 0 2px rgba(255,125,0,.1)}
.msg-input::placeholder{color:var(--hint)}
.send-btn{
  flex-shrink:0;height:36px;padding:0 16px;border-radius:var(--radius-input);border:none;
  background:var(--primary);color:#fff;font-size:14px;font-weight:600;cursor:pointer;transition:all .25s ease
}
.send-btn:active{transform:scale(.94)}
.send-btn.disabled{background:#C9CDD4;pointer-events:none}
</style>
</head>
<body>
<div id="app">
  <!-- ═══ 顶部导航 ═══ -->
  <div class="nav-bar">
    <span class="nav-back" @click="goBack">←</span>
    <div class="nav-avatar">李</div>
    <div class="nav-info">
      <div class="nav-name">山姆拼单 · 李团长</div>
      <div class="nav-status">{{ orderStatusText }}</div>
    </div>
    <span class="nav-more">⋯</span>
  </div>

  <!-- ═══ 消息列表 ═══ -->
  <div class="msg-list" ref="msgListRef">
    <div v-if="newMessages.length===0&&historyLoaded" style="text-align:center;padding:80px 20px;color:#86909C">
      <div style="font-size:56px;margin-bottom:16px">💬</div>
      <div style="font-size:15px;font-weight:500;color:#4E5969">暂无聊天记录</div>
      <div style="font-size:13px;margin-top:6px">发送第一条消息开始沟通吧</div>
    </div>

    <div v-for="m in newMessages" :key="m.id" class="msg-right msg-item">
      <div class="bubble-wrap">
        <div class="bubble">{{ m.text }}</div>
        <div class="time">刚刚</div>
      </div>
    </div>
  </div>

  <!-- ═══ 底部输入栏 ═══ -->
  <div class="input-bar">
    <span class="emoji-btn">😊</span>
    <textarea class="msg-input" v-model="inputText" rows="1" placeholder="输入消息..."
      @keydown.enter.exact.prevent="sendMsg" ref="inputRef"
      @input="autoResize" @focus="scrollToBottom"></textarea>
    <button class="send-btn" :class="{disabled:!inputText.trim()}" @click="sendMsg">发送</button>
  </div>
</div>

<script>
const { ref, reactive, computed, nextTick, onMounted } = Vue;

Vue.createApp({
  setup() { requireAuth();
    var orderId = getQueryParam('id') || '1';
    var inputText = ref(''), msgListRef = ref(null), inputRef = ref(null);
    var newMessages = reactive([]), msgId = 100, historyLoaded = Vue.ref(false);
    var orderStatusText = ref('订单进行中 · 待交接');

    /* ── 加载历史消息 ── */
    function loadHistory() {
      request('/api/v1/chat/' + orderId + '/history').then(function (res) {
        if (res && res.code === 0 && res.data && res.data.items) {
          var items = res.data.items.reverse();
          items.forEach(function (m) {
            var isMe = m.senderId === (getUser()||{}).userId;
            // 将历史消息插入到系统消息之后（DOM已渲染的系统消息保留，API消息追加）
            newMessages.push({ id: m.id, text: m.content, isMe: isMe, time: m.createdAt||'' });
          });
          historyLoaded.value = true; scrollToBottom();
        }
      }).catch(function () {});
    }
    Vue.onMounted(function () { loadHistory(); scrollToBottom(); });

    /* ── 标记已读 ── */
    function markRead() { request('/api/v1/chat/' + orderId + '/read', { method:'POST', body:{} }).catch(function () {}); }
    Vue.onMounted(function () { markRead(); });

    /* ── WebSocket 连接 ── */
    var ws = null;
    function connectWS() {
      var token = getToken(); if (!token) return;
      var proto = location.protocol === 'https:' ? 'wss:' : 'ws:';
      var host = location.host;
      ws = new WebSocket(proto + '//' + host + '/ws/chat/' + orderId + '?token=' + token);
      ws.onmessage = function (e) {
        try {
          var msg = JSON.parse(e.data);
          newMessages.push({ id: ++msgId, text: msg.content || msg.text, isMe: msg.senderId === (getUser()||{}).userId, time: '刚刚' });
          scrollToBottom();
        } catch (er) {}
      };
      ws.onclose = function () { setTimeout(connectWS, 3000); };
    }
    Vue.onMounted(function () { connectWS(); });

    var scrollToBottom = function () { nextTick(function () { var el = msgListRef.value; if (el) el.scrollTop = el.scrollHeight; }); };
    var autoResize = function () { var el = inputRef.value; if (el) { el.style.height = 'auto'; el.style.height = Math.min(el.scrollHeight, 100) + 'px'; } };

    /* ── 发送消息 ── */
    var sendMsg = function () {
      var text = inputText.value.trim(); if (!text) return;
      if (ws && ws.readyState === WebSocket.OPEN) { ws.send(JSON.stringify({ content: text })); }
      newMessages.push({ id: ++msgId, text: text, isMe: true, time: '刚刚' });
      inputText.value = ''; nextTick(function () { autoResize(); scrollToBottom(); });
    };

    var goBack = function () { history.back(); };

    return { inputText, msgListRef, inputRef, newMessages, orderStatusText, historyLoaded, scrollToBottom, autoResize, sendMsg, goBack };
  }
}).use(vant).mount('#app');
</script>
</body>
</html>
